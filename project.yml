name: AIUsage
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_APP_SANDBOX: NO
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  AIUsage:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
      - path: Assets
        buildPhase: resources
      # เฉพาะแพ็กเกจที่แอปรันจริง — engine/tests เคยถูกก็อปไปทั้งยวงเพราะ
      # folder reference ไม่เลือกไฟล์ ผู้ใช้ปลายทางไม่ได้รันเทสต์จากใน .app
      - path: engine/aiusage
        buildPhase: resources
        type: folder
      - path: ai-usage.60s.py
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.aiusage
        PRODUCT_NAME: AIUsage
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AI Usage
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        COMBINE_HIDPI_IMAGES: YES
    postBuildScripts:
      # folder reference ก็อปทุกอย่างรวม __pycache__ ที่ python เขียนทิ้งไว้ตอนรันเทสต์
      - name: ตัด __pycache__ ออกจาก bundle
        basedOnDependencyAnalysis: false
        script: |
          find "$TARGET_BUILD_DIR/$PRODUCT_NAME.app" -name __pycache__ -type d -prune -exec rm -rf {} + 2>/dev/null || true

  AIUsageTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    settings:
      base:
        # ไม่มีบรรทัดนี้ xcodebuild test จะพังตั้งแต่ code sign
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.local.aiusage.tests
    dependencies:
      - target: AIUsage
